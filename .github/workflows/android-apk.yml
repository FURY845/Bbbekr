name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Generate temporary CI signing key
        shell: bash
        run: |
          keytool -genkeypair             -alias upload             -keyalg RSA             -keysize 2048             -validity 3650             -keystore "$RUNNER_TEMP/ci-upload-key.jks"             -storepass ci-build-password             -keypass ci-build-password             -dname "CN=GitHub Actions, OU=CI, O=Alhesab, L=Cairo, ST=Cairo, C=EG"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci-upload-key.jks
          STORE_PASSWORD: ci-build-password
          KEY_PASSWORD: ci-build-password
        run: |
          gradle --no-daemon :app:assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: alhesab-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
